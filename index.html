<!doctype html>
<html lang="en" data-theme="winter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowlist</title>
<!-- The worker looks for this before it saves a fetched copy over the app.
     Without it, an expired pass would have it save the login page instead
     and the installed app would never come back. See site/sw.js. -->
<meta name="flowlist-app" content="1">
<!-- Installing it from the hosted copy. Add to Home screen then opens the
     board on its own, with no browser around it at all — which is what an
     APK wrapped round a web view would have given, without the wrapping.

     crossorigin="use-credentials" is not decoration: a manifest is fetched
     without cookies unless it is asked for, and the site is behind a gate,
     so without this the browser is handed the login page instead and the
     install quietly turns into an ordinary shortcut.

     The single-file copy has no manifest beside it, so bundle.sh takes
     this line out of that build. -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/menus.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="booting">

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64" width="60" height="60" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M32 6v52M9 19l46 26M55 19L9 45"/>
          <path d="M32 16l-6 6M32 16l6 6M32 48l-6-6M32 48l6-6"/>
        </g>
        <circle cx="32" cy="32" r="6" fill="currentColor"/>
      </svg>
    </div>
    <div class="splash-name">Flowlist</div>
    <div class="splash-phrase" id="splash-phrase"></div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<!-- ============ AMBIENT FX ============ -->
<canvas id="fx-snow" aria-hidden="true"></canvas>
<canvas id="fx-confetti" aria-hidden="true"></canvas>
<div id="fx-scene" aria-hidden="true"></div>
<div id="fx-ground" aria-hidden="true"></div>
<div id="fx-stage" aria-hidden="true"></div>
<div id="theme-wipe" aria-hidden="true"></div>

<!-- ============ TOP BAR / WIDGETS ============ -->
<header id="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">Flowlist</span>
  </div>

  <div id="widgetbar" class="widgetbar" data-zone="widgets"></div>

  <div class="topbar-actions">
    <button class="icon-btn" id="btn-undo" title="Nothing to bring back" disabled>
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 9h11a5 5 0 0 1 0 10h-6M4 9l4.5-4.5M4 9l4.5 4.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="Hide the side panels">
      <svg viewBox="0 0 24 24" class="ic"><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4"/></svg>
    </button>
    <button class="icon-btn" id="btn-widget-edit" title="Rearrange widgets">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="2.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="btn-widget-tray" title="Add a widget">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="btn-gear" title="Themes &amp; settings">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/></svg>
    </button>
  </div>
</header>

<!-- ============ MAIN ============ -->
<div id="main">

  <div id="rail">
    <button class="rail-btn" id="btn-view-board" title="Back to the board">
      <svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="4.5" width="5" height="15" rx="1.6"/><rect x="9.5" y="4.5" width="5" height="15" rx="1.6"/><rect x="15.5" y="4.5" width="5" height="10" rx="1.6"/></svg>
      <span>Board</span>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="btn-panel-lists" title="Categories">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Lists</span>
    </button>
    <button class="rail-btn" id="btn-panel-presets" title="Presets">
      <svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="4.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="14" width="7" height="5.5" rx="1.6"/><rect x="13.5" y="14" width="7" height="5.5" rx="1.6"/></svg>
      <span>Presets</span>
    </button>
    <button class="rail-btn" id="btn-panel-canvas" title="Canvas">
      <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M6.5 15.5c2-4 3.5-1.5 5-3.5s2.5-4.5 6-2.5"/><circle cx="8.5" cy="8.5" r="1.4"/></svg>
      <span>Canvas</span>
    </button>
    <button class="rail-btn" id="btn-view-calendar" title="Calendar">
      <svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><rect x="7" y="13" width="3" height="3" rx=".7" fill="currentColor" stroke="none"/></svg>
      <span>Calendar</span>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" id="btn-panel-today" title="Do Today">
      <svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
      <span>Today</span>
    </button>
  </div>

  <aside id="panel-lists" class="panel">
    <div class="panel-head">
      <h2>Categories</h2>
      <div class="panel-head-actions">
        <button class="icon-btn sm" id="btn-add-list" title="New category">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn sm panel-close" data-close="lists" title="Hide panel">
          <svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="list-index"></div>
    <div class="panel-foot"><span id="open-count"></span></div>
  </aside>

  <aside id="panel-presets" class="panel">
    <div class="panel-head">
      <h2>Presets</h2>
      <div class="panel-head-actions">
        <button class="icon-btn sm" id="btn-add-preset" title="New preset">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn sm panel-close" data-close="presets" title="Hide panel">
          <svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="preset-index"></div>
    <div class="panel-foot"><span class="hint">Drag categories from Lists into a preset.</span></div>
  </aside>

  <aside id="panel-canvas" class="panel">
    <div class="panel-head">
      <h2>Canvas</h2>
      <div class="panel-head-actions">
        <button class="icon-btn sm" id="btn-add-canvas" title="New canvas">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn sm panel-close" data-close="canvas" title="Hide panel">
          <svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="canvas-index"></div>
    <div class="panel-foot"><button class="txt-btn" id="btn-back-to-board">&larr; Back to the board</button></div>
  </aside>

  <div id="canvas-wrap">
    <div id="canvas-toolbar" class="ctoolbar">
      <div class="ctool-group" id="ctool-tools"></div>
      <div class="ctool-sep"></div>
      <div class="ctool-group" id="ctool-colors"></div>
      <div class="ctool-sep"></div>
      <div class="ctool-group" id="ctool-width"></div>
      <div class="ctool-sep"></div>
      <div class="ctool-group" id="ctool-add"></div>
      <div class="ctool-sep"></div>
      <div class="ctool-group" id="ctool-zoom"></div>
    </div>
    <div id="canvas-viewport" class="cviewport">
      <div id="canvas-world" class="cworld">
        <svg id="canvas-svg" class="csvg" xmlns="http://www.w3.org/2000/svg">
          <g id="csvg-strokes"></g>
          <g id="csvg-edges"></g>
          <g id="csvg-live"></g>
        </svg>
        <div id="canvas-nodes" class="cnodes"></div>
      </div>
      <div id="sweep-ring"></div>
      <div id="canvas-hint" class="canvas-hint"></div>
    </div>
  </div>

  <!-- The calendar is a surface like the canvas, not a side panel: a month
       needs the width, and it is a way of looking at the whole board. -->
  <div id="calendar-wrap">
    <div class="cal-bar">
      <button class="icon-btn sm" id="cal-prev" title="Previous month">
        <svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h2 id="cal-title"></h2>
      <button class="icon-btn sm" id="cal-next" title="Next month">
        <svg viewBox="0 0 24 24" class="ic"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="txt-btn" id="cal-today">Today</button>
    </div>
    <div class="cal-main">
      <div id="cal-grid" class="cal-grid"></div>
      <aside id="cal-day" class="cal-day"></aside>
    </div>
  </div>

  <div id="board-wrap">
    <div id="preset-bands" aria-hidden="true"></div>
    <div id="board" data-zone="board"></div>
    <div id="board-empty" class="board-empty">
      <div class="be-art">
        <svg viewBox="0 0 120 90" width="160" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <rect x="8" y="14" width="30" height="64" rx="5"/><rect x="45" y="14" width="30" height="64" rx="5"/>
            <rect x="82" y="14" width="30" height="64" rx="5" stroke-dasharray="4 5"/>
            <path d="M14 27h18M14 35h12M51 27h18M51 35h10M51 43h15"/>
          </g>
        </svg>
      </div>
      <p>No categories open.</p>
      <p class="dim">Open one from the <b>Lists</b> panel, or fire a <b>Preset</b> to open a whole set at once.</p>
    </div>
    <div id="grabline" class="grabline"><div id="grabthumb" class="grabthumb"></div></div>
  </div>

  <aside id="panel-today" class="today-dock">
    <div class="today-head">
      <div class="today-title">
        <span class="today-pip"></span>
        <h2>Do Today</h2>
        <span class="today-date" id="today-date"></span>
      </div>
      <div class="panel-head-actions">
        <button class="icon-btn sm" id="btn-today-add" title="New note for today">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn sm" id="btn-today-mode" title="Toggle hour timeline">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3 2"/></svg>
        </button>
        <button class="icon-btn sm panel-close" data-close="today" title="Hide">
          <svg viewBox="0 0 24 24" class="ic"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="today-body" id="today-body"></div>
    <div class="today-foot">
      <span id="today-count"></span>
      <button class="txt-btn" id="btn-today-clear">Clear done</button>
    </div>
  </aside>
</div>

<!-- ============ OVERLAYS ============ -->
<div id="widget-tray" class="tray">
  <div class="tray-head"><h3>Widgets</h3><button class="icon-btn sm" id="tray-close"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tray-grid" id="tray-grid"></div>
</div>

<div id="settings" class="drawer" role="dialog" aria-label="Settings">
  <div class="drawer-head">
    <div class="dh-title"><span class="dh-mark"></span><h3>Settings</h3></div>
    <label class="dh-search">
      <svg viewBox="0 0 24 24" class="ic"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5L20 20"/></svg>
      <input id="settings-search" type="search" placeholder="Find a setting" spellcheck="false" autocomplete="off">
    </label>
    <button class="icon-btn sm" id="settings-close" title="Close (Esc)"><svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-main">
    <nav class="drawer-nav" id="settings-nav" aria-label="Sections"></nav>
    <div class="drawer-body" id="settings-body"></div>
  </div>
</div>

<div id="drop-remove" class="drop-remove" aria-hidden="true">
  <div class="dr-inner">
    <svg viewBox="0 0 24 24" class="dr-icon"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
    <div class="dr-label"></div>
    <div class="dr-sub"></div>
  </div>
</div>

<button id="zen-exit" class="zen-exit" title="Bring everything back (Esc)">
  <svg viewBox="0 0 24 24" class="ic"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>
</button>

<div id="scrim" class="scrim"></div>
<div id="ctx" class="ctxmenu" role="menu"></div>
<div id="dnd-ghost" class="dnd-ghost"></div>
<div id="toast" class="toast"></div>

<div id="sync-note" class="sync-note" role="status" aria-live="polite">
  <span class="sn-dot"></span>
  <div class="sn-text"><b class="sn-title"></b><span class="sn-sub"></span></div>
  <button class="sn-see">See what changed</button>
  <button class="sn-x" title="Dismiss">
    <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<div id="sync-log" class="logpanel">
  <div class="log-head">
    <h3>What sync has done</h3>
    <div class="log-actions">
      <button class="txt-btn" id="log-clear">Clear</button>
      <button class="icon-btn sm" id="log-close" title="Close">
        <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="log-body" id="log-body"></div>
</div>

<script src="js/profiles.js"></script>
<!-- before store.js: the store has to recognise a sealed board as it loads,
     and a board that is not recognised gets written over -->
<script src="js/keyfile.js"></script>
<script src="js/unlock.js"></script>
<script src="js/store.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/dnd.js"></script>
<script src="js/doubletap.js"></script>
<script src="js/rename.js"></script>
<script src="js/menu.js"></script>
<script src="js/when.js"></script>
<script src="js/lists.js"></script>
<script src="js/today.js"></script>
<script src="js/presets.js"></script>
<script src="js/dropzone.js"></script>
<script src="js/canvas.js"></script>
<script src="js/calendar.js"></script>
<script src="js/widgets.js"></script>
<script src="js/confetti.js"></script>
<script src="js/ntfy.js"></script>
<script src="js/offline.js"></script>
<script src="js/fullscreen.js"></script>
<script src="js/mobile.js"></script>
<script src="js/layouts.js"></script>
<script src="js/merge.js"></script>
<script src="js/sync.js"></script>
<script src="js/scenes.js"></script>
<script src="js/lock.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
